# ============================================================================
# API GATEWAY CONFIGURATION
# ============================================================================
# This is the central entry point for all microservices requests.
# It handles routing, authentication, rate limiting, and circuit breaking.

spring:
  # Application name registered in Eureka
  application:
    name: apigateway

  # Force WebFlux (reactive) instead of Spring MVC
  # Spring Cloud Gateway requires reactive stack
  main:
    web-application-type: reactive

  # Redis configuration for caching and rate limiting
  # Used by RateLimitFilter and potentially for distributed rate limiting
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms # Connection timeout
  # Spring Cloud Gateway configuration
  # Using WebFlux reactive stack (required for Spring Cloud Gateway)
  # IMPORTANT: In Spring Cloud 2025.0.0+, the property prefix changed:
  # - OLD (deprecated): spring.cloud.gateway.*
  # - NEW: spring.cloud.gateway.server.webflux.*
  cloud:
    gateway:
      # Enable metrics for monitoring
      # Server WebFlux configuration (NEW format for Spring Cloud 2025.0.0+)
      server:
        webflux:
          # Route definitions
          # IMPORTANT: OpenAPI routes must be defined BEFORE service routes
          # to ensure /api/*/v3/api-docs paths are matched first
          routes:
            # ====================================================================
            # OpenAPI/Swagger routes - Proxy OpenAPI docs from microservices
            # These routes must be FIRST to avoid conflicts with service routes
            # ====================================================================
            
            # User Service OpenAPI
            - id: user-service-openapi
              uri: lb://user-service
              predicates:
                - Path=/api/users/v3/api-docs/**
              filters:
                - RewritePath=/api/users/(?<segment>.*), /$\{segment}

            # Ticket Service OpenAPI
            - id: ticket-service-openapi
              uri: lb://ticket-service
              predicates:
                - Path=/api/tickets/v3/api-docs/**
              filters:
                - RewritePath=/api/tickets/(?<segment>.*), /$\{segment}

            # Inventory Service OpenAPI
            - id: inventory-service-openapi
              uri: lb://inventory-service
              predicates:
                - Path=/api/inventory/v3/api-docs/**
              filters:
                - RewritePath=/api/inventory/(?<segment>.*), /$\{segment}

            # Payment Service OpenAPI
            - id: payment-service-openapi
              uri: lb://payment-service
              predicates:
                - Path=/api/payments/v3/api-docs/**
              filters:
                - RewritePath=/api/payments/(?<segment>.*), /$\{segment}

            # Notification Service OpenAPI
            - id: notification-service-openapi
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications/v3/api-docs/**
              filters:
                - RewritePath=/api/notifications/(?<segment>.*), /$\{segment}

            # ====================================================================
            # Service routes - Main API routes
            # ====================================================================
            
            # Route: User Service
            # Matches: /api/users/** -> forwards to user-service
            - id: user-service
              uri: lb://user-service # lb:// = load balance via Eureka service discovery
              predicates:
                - Path=/api/users/** # Match all paths starting with /api/users/
              filters:
                - StripPrefix=1 # Remove /api prefix before forwarding
                - name: CircuitBreaker # Enable circuit breaker for fault tolerance
                  args:
                    name: user-service-circuit-breaker
                    fallbackUri: forward:/fallback/user-service # Fallback when service is down

            # Route: Ticket Service
            # Matches: /api/tickets/** -> forwards to ticket-service
            - id: ticket-service
              uri: lb://ticket-service
              predicates:
                - Path=/api/tickets/**
              filters:
                - StripPrefix=1
                - name: CircuitBreaker
                  args:
                    name: ticket-service-circuit-breaker
                    fallbackUri: forward:/fallback/ticket-service

            # Route: Inventory Service
            # Matches: /api/inventory/** -> forwards to inventory-service
            - id: inventory-service
              uri: lb://inventory-service
              predicates:
                - Path=/api/inventory/**
              filters:
                - StripPrefix=2
                - name: CircuitBreaker
                  args:
                    name: inventory-service-circuit-breaker
                    fallbackUri: forward:/fallback/inventory-service

            # Route: Payment Service
            # Matches: /api/payments/** -> forwards to payment-service
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/api/payments/**
              filters:
                - StripPrefix=1
                - name: CircuitBreaker
                  args:
                    name: payment-service-circuit-breaker
                    fallbackUri: forward:/fallback/payment-service

            # Route: Notification Service
            # Matches: /api/notifications/** -> forwards to notification-service
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/notifications/**
              filters:
                - StripPrefix=1
                - name: CircuitBreaker
                  args:
                    name: notification-service-circuit-breaker
                    fallbackUri: forward:/fallback/notification-service
          metrics:
            enabled: true

# ============================================================================
# SERVER CONFIGURATION
# ============================================================================
server:
  port: 8189 # Gateway listens on port 8189

# ============================================================================
# EUREKA SERVICE DISCOVERY CONFIGURATION
# ============================================================================
# Eureka allows services to discover each other dynamically
# Gateway uses Eureka to find backend service instances
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/ # Eureka server location
    fetch-registry: true # Fetch service registry from Eureka
    register-with-eureka: true # Register this gateway with Eureka

# ============================================================================
# RESILIENCE4J CONFIGURATION
# ============================================================================
# Provides circuit breaker and rate limiting capabilities
resilience4j:
  # Circuit Breaker: Prevents cascading failures
  # Opens circuit when service fails too often, returns fallback response
  circuitbreaker:
    configs:
      # Default configuration for all circuit breakers
      default:
        slidingWindowSize: 10 # Number of calls to track
        minimumNumberOfCalls: 5 # Minimum calls before circuit can open
        failureRateThreshold: 50 # Open circuit if 50% of calls fail
        waitDurationInOpenState: 10s # Wait 10s before trying again
        permittedNumberOfCallsInHalfOpenState: 3 # Test with 3 calls when half-open

      # Service-specific circuit breaker configurations
      # Each service can have different thresholds based on criticality
      user-service-circuit-breaker:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
      ticket-service-circuit-breaker:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
      inventory-service-circuit-breaker:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
      payment-service-circuit-breaker:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
      notification-service-circuit-breaker:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s

  # Rate Limiter: Controls request rate
  # Currently configured but not actively used (RateLimitFilter uses in-memory)
  ratelimiter:
    configs:
      default:
        limitForPeriod: 100 # Allow 100 requests
        limitRefreshPeriod: 1s # Per 1 second
        timeoutDuration: 0 # No timeout (fail immediately if limit exceeded)

# ============================================================================
# ACTUATOR (MONITORING) CONFIGURATION
# ============================================================================
# Exposes health checks, metrics, and monitoring endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus # Expose these endpoints
  endpoint:
    health:
      show-details: always # Always show detailed health information

# ============================================================================
# OPENAPI/SWAGGER CONFIGURATION
# ============================================================================
# API Documentation and debugging tool
# 
# Access Swagger UI: http://localhost:8189/swagger-ui.html
# 
# Swagger UI sẽ hiển thị dropdown "Select a definition" ở góc trên bên phải
# để chọn service muốn xem:
# - All Services (Gateway) - Tất cả APIs
# - User Service API - Chỉ APIs từ User Service
# - Ticket Service API - Chỉ APIs từ Ticket Service
# - Inventory Service API - Chỉ APIs từ Inventory Service
# - Payment Service API - Chỉ APIs từ Payment Service
# - Notification Service API - Chỉ APIs từ Notification Service
# 
# Direct OpenAPI JSON URLs:
# - Gateway: http://localhost:8189/v3/api-docs
# - User Service: http://localhost:8189/api/users/v3/api-docs
# - Ticket Service: http://localhost:8189/api/tickets/v3/api-docs
# - Inventory Service: http://localhost:8189/api/inventory/v3/api-docs
# - Payment Service: http://localhost:8189/api/payments/v3/api-docs
# - Notification Service: http://localhost:8189/api/notifications/v3/api-docs
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
    groups:
      enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    # Enable group selection in Swagger UI
    urls:
      - name: All Services (Gateway)
        url: /v3/api-docs
        display-name: All Services
      - name: User Service
        url: /api/users/v3/api-docs
        display-name: User Service API
      - name: Ticket Service
        url: /api/tickets/v3/api-docs
        display-name: Ticket Service API
      - name: Inventory Service
        url: /api/inventory/v3/api-docs
        display-name: Inventory Service API
      - name: Payment Service
        url: /api/payments/v3/api-docs
        display-name: Payment Service API
      - name: Notification Service
        url: /api/notifications/v3/api-docs
        display-name: Notification Service API
    # Add CORS configuration for Swagger UI
    try-it-out-enabled: true
    filter: true

# ============================================================================
# KEYCLOAK CONFIGURATION
# ============================================================================
# Keycloak is used for authentication and authorization
# JwtAuthenticationFilter validates Keycloak tokens and extracts user info
keycloak:
  # Keycloak server URL (e.g., http://localhost:8080 or https://keycloak.example.com)
  server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8080}
  # Realm name configured in Keycloak
  realm: ${KEYCLOAK_REALM:train-ticket}
  # Client ID configured in Keycloak realm
  # This should be a public client or confidential client with appropriate settings
  client-id: ${KEYCLOAK_CLIENT_ID:train-ticket-gateway}
