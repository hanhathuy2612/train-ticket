spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://localhost:5432/trainticket
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

server:
  port: 8085

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

---
# Docker Profile
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://postgres:5432/trainticket
  kafka:
    bootstrap-servers: kafka:9093

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

# ============================================================================
# KEYCLOAK CONFIGURATION (for token verification)
# ============================================================================
# Used by TokenVerificationInterceptor to verify tokens forwarded from gateway
keycloak:
  server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8080}
  realm: ${KEYCLOAK_REALM:train-ticket}

# Token verification setting
# Set to false to trust headers from gateway (for internal network)
# In production with mTLS/internal network, you can set this to false
token:
  verification:
    enabled: ${TOKEN_VERIFICATION_ENABLED:true}

